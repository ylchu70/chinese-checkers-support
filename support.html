<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chinese Checkers App 支援與常見問題">
  <title>支援｜Chinese Checkers</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f1e8; color: #242424; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    article { background: #fff; border-radius: 24px; padding: 40px; box-shadow: 0 14px 40px rgba(0,0,0,.08); }
    h1 { margin-top: 0; color: #a51f2d; }
    h2 { margin-top: 30px; font-size: 1.15rem; }
    p, li { line-height: 1.7; }
    a { color: #0b64b4; font-weight: 600; }
    .button { display: inline-block; margin-top: 8px; padding: 12px 18px; color: white; background: #0b64b4; border-radius: 12px; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #171717; color: #eee; }
      article { background: #252525; }
      a { color: #7fc2ff; }
      .button { color: #fff; }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <p><a href="index.html">← 回到首頁</a></p>
      <h1>支援與常見問題</h1>
      <h2>如何遊玩？</h2>
      <p>您操作從棋盤下方出發的紅棋，黃棋與藍棋由 AI 控制。率先將全部 15 枚棋子移至正對面的目標區即可獲勝。</p>
      <h2>棋子如何移動？</h2>
      <p>棋子可移至相鄰空位，也可沿直線越過一枚棋子，跳至另一側等距離的空位。跳躍前後可以隔著相同數量的空位，並可在同一回合連續跳躍。</p>
      <h2>需要網路或帳號嗎？</h2>
      <p>不需要。本 App 無需註冊或登入，遊戲可離線進行。</p>
      <h2>如何回報問題？</h2>
      <p>請在公開問題追蹤頁建立一則回報，並附上裝置型號、iOS 版本及問題說明。請勿在公開內容中填寫電話、住址或其他個人資料。</p>
      <a class="button" href="https://github.com/ylchu70/chinese-checkers-support/issues/new">回報問題</a>
    </article>
  </main>
</body>
</html>
