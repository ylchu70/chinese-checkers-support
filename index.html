<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chinese Checkers App 支援與隱私權資訊">
  <title>Chinese Checkers</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f1e8; color: #242424; }
    main { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
    .card { background: #fff; border-radius: 24px; padding: 40px; box-shadow: 0 14px 40px rgba(0,0,0,.08); }
    h1 { margin-top: 0; color: #a51f2d; }
    p { line-height: 1.7; }
    nav { display: grid; gap: 14px; margin-top: 28px; }
    a { color: #0b64b4; font-weight: 600; }
    nav a { display: block; padding: 16px 18px; border: 1px solid #ddd4c5; border-radius: 14px; text-decoration: none; background: #fffaf1; }
    @media (prefers-color-scheme: dark) {
      body { background: #171717; color: #eee; }
      .card { background: #252525; }
      nav a { background: #2d2a25; border-color: #504b43; }
      a { color: #7fc2ff; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Chinese Checkers</h1>
      <p>iPhone 與 iPad 的三方中國跳棋遊戲。玩家操作紅棋，與黃棋及藍棋 AI 對戰。</p>
      <nav aria-label="支援頁面">
        <a href="support.html">支援與常見問題</a>
        <a href="privacy.html">隱私權政策</a>
      </nav>
    </section>
  </main>
</body>
</html>
